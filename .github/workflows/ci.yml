name: CI/CD Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Начинаем сборку..."
          cd code-samples && make
          echo "Сборка завершена успешно!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DO-binary
          path: code-samples/DO
          retention-days: 30

  style:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check code style
        run: |
          echo "Проверяем кодстайл..."
          cd code-samples
          clang-format -n --Werror *.c
          echo "Кодстайл в порядке!"

  integration:
    runs-on: self-hosted
    needs: [build, style]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          cd code-samples
          make
          chmod +x ../src/tests/test.sh
          bash ../src/tests/test.sh
