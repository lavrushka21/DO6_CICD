name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build cat and grep
        run: |
          echo "Начинаем сборку..."
          cd src/cat && make
          cd ../grep && make
          echo "Сборка завершена успешно!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            src/cat/s21_cat
            src/grep/s21_grep
          retention-days: 30

  style:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check code style
        run: |
          echo "Проверяем кодстайл..."
          cd src/cat && clang-format -n --Werror *.c *.h
          cd ../grep && clang-format -n --Werror *.c *.h
          echo "Кодстайл в порядке!"

  integration:
    runs-on: self-hosted
    needs: [build, style]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          cd src/cat && make
          cd ../grep && make
          cd ../..
          bash src/tests/test_cat.sh
          bash src/tests/test_grep.sh

  deploy:
    runs-on: self-hosted
    needs: [build, style, integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd src/cat && make
          cd ../grep && make

      - name: Deploy
        run: bash deploy.sh